name: One-time top-15 summaries kickoff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-top15-kickoff.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Request top-15 summaries workflow run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run top-15-summaries.yml --repo WittmannF/gnewsbr --ref main
