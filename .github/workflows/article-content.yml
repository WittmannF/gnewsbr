name: Archive article content

on:
  schedule:
    # Runs once a day after the hourly Google News refresh has had time to commit.
    - cron: '23 10 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Archive date key to process (YYYY-MM-DD). Defaults to today UTC.'
        required: false
        type: string
      max_clusters:
        description: 'Maximum clusters to archive.'
        required: false
        default: '20'
        type: string

concurrency:
  group: article-archive-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive-article-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Archive clean article text
        env:
          DATE_INPUT: ${{ inputs.date }}
          MAX_CLUSTERS_INPUT: ${{ inputs.max_clusters }}
        run: |
          DATE_ARG=""
          if [ -n "$DATE_INPUT" ]; then
            DATE_ARG="--date $DATE_INPUT"
          fi
          MAX_CLUSTERS="${MAX_CLUSTERS_INPUT:-20}"
          python3 scripts/archive_article_content.py \
            $DATE_ARG \
            --max-clusters "$MAX_CLUSTERS" \
            --min-articles-per-cluster 5 \
            --max-articles-per-cluster 8 \
            --timeout 20 \
            --sleep 0.25

      - name: Commit article content archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/article-content/
          if git diff --cached --quiet; then
            echo "No article content changes to commit."
          else
            git commit -m "chore(data): archive article content"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing on origin/${GITHUB_REF_NAME:-main} before retry $attempt..."
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
            git push
          fi
