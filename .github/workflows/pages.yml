name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules are UTC. This updates data and republishes hourly.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  # Queue refreshes rather than cancelling a one-time synthesis recovery when
  # an hourly schedule fires. GitHub retains at most one pending run per group.
  group: pages-refresh-${{ github.ref }}
  cancel-in-progress: false

# Opt in early to the GitHub Actions Node.js 24 runtime so the workflow does not
# depend on the deprecated Node.js 20 action runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Queued push runs can start after a scheduled run commits newer data.
          # Check out current main, not the stale triggering event SHA.
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source spectrum
        run: |
          npm run sources:validate
          npm run sources:build

      - name: Detect missing published cluster details
        id: integrity
        run: |
          if python3 scripts/check_published_cluster_details.py --root public; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Google News data
        id: refresh
        if: github.event_name != 'push' || steps.integrity.outputs.missing == 'true'
        run: npm run collect

      - name: Add cached top-15 AI summaries to this homepage snapshot
        id: summarize
        if: vars.ENABLE_GNEWSBR_SYNTHESIS != 'false'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'z-ai/glm-5.3-flash' }}
        run: |
          python3 scripts/summarize_home.py --max-new 15

      - name: Commit refreshed data and linked detail files
        if: steps.refresh.outcome == 'success' || steps.summarize.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/data/latest.json public/data/clusters/latest/ public/data/archive/ public/data/source-spectrum.json
          git add -A public/data/enrichment/briefs/ data/enrichment/cost-ledger/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh Google News stories"
            # The article archiver can change tracked full-text files that are
            # intentionally excluded from the commit and Pages artifact.
            # A dirty worktree prevents the recovery rebase after a concurrent
            # PR merge. Discard only uncommitted tracked changes, never staged
            # or committed news/ledger data. Do not publish raw article text.
            git restore --worktree .
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing on origin/${GITHUB_REF_NAME:-main} before retry $attempt..."
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
            git push
          fi

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Limit published data to last 30 days
        run: npm run publish:prune

      - name: Validate all detail links before deploying
        run: python3 scripts/check_published_cluster_details.py --root dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
