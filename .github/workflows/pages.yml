name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules are UTC. This updates data and republishes hourly.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  # Keep only the newest Pages refresh/deploy for a given ref. This prevents the
  # hourly schedule from building a backlog of pending runs.
  group: pages-refresh-${{ github.ref }}
  cancel-in-progress: true

# Opt in early to the GitHub Actions Node.js 24 runtime so the workflow does not
# depend on the deprecated Node.js 20 action runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source spectrum
        run: |
          npm run sources:validate
          npm run sources:build

      - name: Refresh Google News data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: npm run collect

      - name: Commit refreshed data
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/archive/*.json public/data/source-spectrum.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh Google News stories"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing on origin/${GITHUB_REF_NAME:-main} before retry $attempt..."
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
            git push
          fi

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Limit published data to last 30 days
        run: npm run publish:prune

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
