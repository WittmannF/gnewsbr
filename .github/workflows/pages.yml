name: Update data and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    # GitHub schedules are UTC. This updates data and republishes hourly.
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  # Keep only the newest Pages refresh/deploy for a given ref. This prevents the
  # hourly schedule from building a backlog of pending runs.
  group: pages-refresh-${{ github.ref }}
  cancel-in-progress: true

# Opt in early to the GitHub Actions Node.js 24 runtime so the workflow does not
# depend on the deprecated Node.js 20 action runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  update-build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate source spectrum
        run: |
          npm run sources:validate
          npm run sources:build

      - name: Detect missing published cluster details
        id: integrity
        run: |
          if python3 scripts/check_published_cluster_details.py --root public; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh Google News data
        id: refresh
        if: github.event_name != 'push' || steps.integrity.outputs.missing == 'true'
        run: npm run collect

      - name: Bootstrap today's top 15 source-linked syntheses
        if: github.event_name == 'push' && steps.integrity.outputs.missing == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'z-ai/glm-5.3-flash' }}
        run: |
          DATE="$(date -u +%F)"
          python3 scripts/archive_article_content.py \
            --date "$DATE" --max-clusters 15 --frontpage-top 15 \
            --min-articles-per-cluster 5 --max-articles-per-cluster 8 \
            --timeout 15 --sleep 0.1
          if [ -n "$OPENROUTER_API_KEY" ]; then
            python3 scripts/generate_news_synthesis.py \
              --date "$DATE" --max-clusters 15 --disable-jev
          else
            echo "Cannot generate AI news: OPENROUTER_API_KEY is absent"
            exit 1
          fi

      - name: Commit refreshed data and linked detail files
        if: steps.refresh.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE="$(date -u +%F)"
          git add -A public/data/latest.json public/data/clusters/latest/ "public/data/archive/$DATE/" public/data/source-spectrum.json
          git add -A public/data/enrichment/news/ data/enrichment/cost-ledger/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh Google News stories"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push failed; rebasing on origin/${GITHUB_REF_NAME:-main} before retry $attempt..."
              git pull --rebase origin "${GITHUB_REF_NAME:-main}"
            done
            git push
          fi

      - name: Build
        env:
          GITHUB_PAGES: 'true'
        run: npm run build

      - name: Limit published data to last 30 days
        run: npm run publish:prune

      - name: Validate all detail links before deploying
        run: python3 scripts/check_published_cluster_details.py --root dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Report top-15 deployment to issue #16
        if: always() && github.event_name == 'push' && steps.integrity.outputs.missing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
        run: |
          COVERAGE="$(python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('public/data')
          home_file = root / 'latest.json'
          synth_file = root / 'enrichment/news/latest.json'
          try:
              home = json.loads(home_file.read_text(encoding='utf-8'))
              synth = json.loads(synth_file.read_text(encoding='utf-8'))
              ids = [c['id'] for c in home['clusters'][:15]]
              covered = [cid for cid in ids if cid in synth.get('stories', {})]
              print(f'{len(covered)}/{len(ids)}')
          except (OSError, KeyError, ValueError):
              print('unavailable')
          PY
          )"
          BODY="GNewsBR Pages bootstrap: deployment=${DEPLOY_RESULT}, top15_synthesized=${COVERAGE}. Workflow: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. This count is based on committed JSON, not model promises."
          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/16/comments" -f body="${BODY}"
