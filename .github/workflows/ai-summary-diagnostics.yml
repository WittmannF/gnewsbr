name: AI summary diagnostics (isolated)
on:
  workflow_dispatch:
    inputs:
      live:
        description: 'Allow paid OpenRouter experiments (explicit opt-in only)'
        type: boolean
        default: false
  push:
    branches:
      - work/gnewsbr-ai-diagnostic-program
    paths:
      - 'engineering/**'
      - '.github/workflows/ai-summary-diagnostics.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify isolation and state contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('engineering/gnewsbr-program-state.json').read_text())
          assert state['merge_approval']=='NOT_GRANTED'
          assert state['diagnostic_budget_usd']==5
          assert state['phase'] in ('DIAGNOSTIC_SETUP','DIAGNOSE','ROOT_CAUSE_REPORT')
          print('offline state checks passed; no paid model calls')
          PY
      - name: Install minimal production schema dependencies
        run: python -m pip install 'requests>=2.31,<3' 'pydantic>=2,<3'
      - name: Offline Brief contract regression tests
        run: python engineering/diagnose_brief_contract.py
      - name: Diagnostic preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          assert Path('scripts/summarize_home.py').exists()
          print('diagnostic workflow isolated from production cache, ledger, and deployment')
          PY
      - name: Historical recovery safety and provenance tests (offline)
        run: python -m unittest discover -s engineering -p 'test_recover_historical_inputs.py' -v
      - name: Offline replay audit contract tests
        run: python -m unittest discover -s engineering -p 'test_audit_replay_coverage.py' -v
      - name: Recover historical inputs from immutable commits (offline)
        run: python engineering/recover_historical_inputs.py --output /tmp/gnewsbr-replay-inputs.json
      - name: Audit recovered inputs and provenance (offline)
        run: python engineering/audit_replay_coverage.py --input /tmp/gnewsbr-replay-inputs.json --output /tmp/gnewsbr-replay-audit.json --manifest engineering/fixtures/2026-11-05-cluster-replay-manifest.json
      - name: Upload replay audit (no article text)
        uses: actions/upload-artifact@v4
        with:
          name: gnewsbr-replay-audit
          path: /tmp/gnewsbr-replay-audit.json
          retention-days: 7
      # Raw historical article text remains local to the ephemeral runner.
      # Only the aggregate, text-free audit is uploaded as an artifact.
